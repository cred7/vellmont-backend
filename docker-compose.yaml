services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5643}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      vellmont_frontend:
        condition: service_started
      vellmont:
        condition: service_started

  vellmont:
    image: vellmont:v1.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vellmont}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-vellmont}
      JWT_SECRET: ${JWT_SECRET:-vellmont-local-development-secret-change-me}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    # ports:
    #   - "${BACKEND_PORT:-5000}:3000"

  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vellmont}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-vellmont}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - vellmont_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  vellmont_frontend:
    image: vellmont-frontend:local
    build:
      context: ../vellmont_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      vellmont:
        condition: service_started
    # ports:
    #   - "${FRONTEND_PORT:-5640}:80"

volumes:
  vellmont_postgres_data:
