apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vellmont
  namespace: vellmont
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vellmont
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: vellmont
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vellmont-frontend
                port:
                  number: 80
