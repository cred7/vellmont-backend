---
apiVersion: v1
kind: Service
metadata:
  name: vellmont
  namespace: vellmont
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: vellmont
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vellmont
  namespace: vellmont
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vellmont
  template:
    metadata:
      labels:
        app: vellmont
    spec:
      # initContainers:
      #   - name: wait-for-postgres
      #     image: postgres:16-alpine
      #     command:
      #       - sh
      #       - -c
      #       - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres"; sleep 2; done
      #     env:
      #       - name: POSTGRES_USER
      #         valueFrom:
      #           secretKeyRef:
      #             name: vellmont
      #             key: POSTGRES_USER
      #       - name: POSTGRES_DB
      #         valueFrom:
      #           secretKeyRef:
      #             name: vellmont
      #             key: POSTGRES_DB
      containers:
        - name: backend
          image: vellmont:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vellmont
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vellmont
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vellmont-frontend
  namespace: vellmont
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: vellmont-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vellmont-frontend
  namespace: vellmont
spec:
  replicas: 10
  selector:
    matchLabels:
      app: vellmont-frontend
  template:
    metadata:
      labels:
        app: vellmont-frontend
    spec:
      containers:
        - name: frontend
          image: vellmont-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
