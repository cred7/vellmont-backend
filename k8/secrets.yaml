apiVersion: v1
kind: Secret
metadata:
  name: vellmont
  namespace: vellmont
type: Opaque
stringData:
  POSTGRES_USER: vellmont
  POSTGRES_PASSWORD: password
  POSTGRES_DB: vellmont
  DATABASE_URL: postgres://vellmont:password@host.docker.internal:5442/vellmont
  JWT_SECRET: vellmont-kind-local-development-jwt-secret-change-me
